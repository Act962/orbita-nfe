name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Regras de camadas e módulos
        run: npm run deps
      - name: Testes (inclui teste canário de segredos)
        run: npm run test:coverage
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

  # Spikes da Fase 1 (código temporário, spikes/README.md). Removido quando os spikes forem
  # promovidos a adapters definitivos.
  spikes:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orbita_nfe
          POSTGRES_USER: fiscal_owner
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscal_owner -d orbita_nfe"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SPIKE_DATABASE_URL: postgres://fiscal_owner:ci-only-password@127.0.0.1:5432/orbita_nfe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run spikes

  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem da aplicação
        run: docker build -f docker/Dockerfile -t orbita-nfe:${{ github.sha }} .
      - name: Build da imagem do banco (confere o checksum do WAL-G)
        run: docker build -f docker/postgres/Dockerfile -t orbita-nfe-postgres:${{ github.sha }} .
      - name: Compose de produção válido
        env:
          IMAGE_TAG: sha-ci
          POSTGRES_IMAGE_TAG: sha-ci
          WALG_S3_PREFIX: s3://ci/ci
          BACKUP_S3_ENDPOINT: https://s3.invalid
          MIGRATION_DATABASE_URL: postgres://ci
          API_DATABASE_URL: postgres://ci
          WORKER_DATABASE_URL: postgres://ci
          GENERAL_DATABASE_URL: postgres://ci
          AUDIT_ANCHOR_S3_ENDPOINT: https://s3.invalid
          AUDIT_ANCHOR_S3_BUCKET: ci-anchors
        run: docker compose -f docker/coolify/docker-compose.yml config --quiet

  # Publica as imagens no GHCR só em push na main que passou em tudo (ADR-0020: o Coolify só faz
  # deploy de imagem pronta, fixada por tag imutável sha-<commit>).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, docker]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build e push das imagens
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="sha-${GITHUB_SHA::12}"
          for image in orbita-nfe:docker/Dockerfile orbita-nfe-postgres:docker/postgres/Dockerfile; do
            name="ghcr.io/${owner}/${image%%:*}"
            docker build -f "${image#*:}" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "${name}:${tag}" -t "${name}:main" .
            docker push "${name}:${tag}"
            docker push "${name}:main"
          done
          echo "Imagens publicadas com a tag ${tag}" >> "$GITHUB_STEP_SUMMARY"
