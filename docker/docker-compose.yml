# Ambiente de desenvolvimento local. Produção roda no Coolify (docs/architecture/15).
name: orbita-nfe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbita_nfe
      POSTGRES_USER: fiscal_owner
      # Senha apenas de desenvolvimento local; nunca reutilizar fora daqui.
      POSTGRES_PASSWORD: dev-only-password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscal_owner -d orbita_nfe"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 local para dev/teste (ADR-0010). Em produção: provedor S3 externo.
  # Escolha entre SeaweedFS e Garage será confirmada no spike da Fase 1.
  object-storage:
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
